<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand El Hajj Studio Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh; background-color: #0f1115; color: #d1d5db;
      display: flex; flex-direction: column; overflow: hidden; font-size: 11px;
    }

    header {
      height: 42px; background: #161920; border-bottom: 1px solid #262b36;
      display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
    }
    .brand { font-weight: 800; font-size: 13px; color: #10b981; letter-spacing: 1.5px; }
    .btn-action { background: #1e293b; color: #38bdf8; border: 1px solid #334155; font-weight: 600; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn-action:hover { background: #334155; color: #fff; }

    .workspace { display: flex; flex-direction: column; flex: 1; height: calc(100vh - 42px); }

    /* CANVAS & TOP PANEL */
    .top-section { display: flex; height: 55%; background: #0b0c10; border-bottom: 1px solid #262b36; }
    .canvas-box { flex: 1; background: #000; display: flex; flex-direction: column; position: relative; }
    .canvas-header { background: #161920; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #262b36; }
    .canvas-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #000; }
    canvas { max-width: 100%; max-height: 100%; object-fit: contain; background: #050505; }

    /* FULLSCREEN CANVAS */
    .canvas-container:fullscreen { width: 100vw; height: 100vh; background: #000; }
    .canvas-container:fullscreen canvas { width: 100vw; height: 100vh; max-width: none; max-height: none; }

    /* SIDE PANEL CONTROLLER */
    .control-panel { width: 320px; background: #161920; border-left: 1px solid #262b36; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .section-title { font-weight: 700; color: #10b981; border-bottom: 1px solid #262b36; padding-bottom: 4px; font-size: 11px; margin-top: 4px; }
    .scale-group { display: flex; flex-direction: column; gap: 4px; background: #111318; padding: 6px; border-radius: 4px; border: 1px solid #262b36; }
    .scale-row { display: flex; align-items: center; gap: 6px; }
    .scale-row label { width: 75px; font-size: 10px; color: #94a3b8; }
    .scale-row input[type=range] { flex: 1; }

    /* BOTTOM MATRIX GRID */
    .matrix-section { display: flex; flex: 1; background: #0f1115; overflow: hidden; }
    .layers-stack { flex: 1; display: flex; flex-direction: column; padding: 8px; gap: 8px; overflow-y: auto; }
    .layer-row { display: flex; height: 95px; background: #161920; border: 1px solid #262b36; border-radius: 4px; }
    .layer-head { width: 140px; background: #1a1e26; padding: 8px; border-right: 1px solid #262b36; display: flex; flex-direction: column; justify-content: space-between; }
    .clips-container { flex: 1; display: flex; gap: 8px; padding: 8px; overflow-x: auto; align-items: center; }

    /* SLOT MATRIX UI */
    .clip-slot {
      min-width: 110px; width: 110px; height: 100%; background: #1a1e26; border: 1px dashed #334155; border-radius: 4px;
      cursor: pointer; position: relative; overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .clip-slot:hover { border-color: #10b981; background: #222733; }
    .clip-slot.active { border: 2px solid #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
    .clip-slot.active::after {
      content: 'LIVE'; position: absolute; top: 2px; right: 2px; background: #ef4444; color: #fff;
      font-size: 7px; font-weight: bold; padding: 1px 3px; border-radius: 2px; z-index: 10;
    }
    
    .slot-preview { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; pointer-events: none; }
    .slot-overlay-info { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.6); color: #fff; padding: 1px 4px; font-size: 8px; border-radius: 2px; pointer-events: none; }

    .clip-controls {
      position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(15, 17, 21, 0.95);
      display: flex; justify-content: space-between; padding: 3px; z-index: 5;
    }
    .btn-ctrl { background: #334155; color: #fff; border: none; padding: 3px 6px; font-size: 9px; border-radius: 2px; cursor: pointer; }
    .btn-ctrl:hover { background: #475569; }
    .btn-ctrl.danger { background: #ef4444; color: #fff; }
    .btn-ctrl.danger:hover { background: #dc2626; }
  </style>
</head>
<body>

  <header>
    <div class="brand">GRAND EL HAJJ // BROADCAST ENGINE</div>
    <div>
      <button class="btn-action" onclick="toggleFullScreen()">🖥️ FULLSCREEN (1 LAYAR)</button>
    </div>
  </header>

  <div class="workspace">
    <div class="top-section">
      <!-- CANVAS DISPLAY -->
      <div class="canvas-box">
        <div class="canvas-header">
          <span style="font-weight:700; color:#38bdf8;">PROGRAM OUTPUT PREVIEW</span>
          <span style="color:#94a3b8; font-size:10px;">CANVAS 1280x720</span>
        </div>
        <div class="canvas-container" id="canvasContainer">
          <canvas id="masterCanvas" width="1280" height="720"></canvas>
        </div>
      </div>

      <!-- KONTROL UKURAN & POSISI TIAP LAYAR -->
      <div class="control-panel">
        <div class="section-title">📐 KONTROL 3 LAYAR INDEPENDEN</div>

        <!-- LAYAR KANAN -->
        <div class="scale-group">
          <span style="color:#38bdf8; font-weight:bold;">1. Layar Kanan</span>
          <div class="scale-row"><label>Lebar (%):</label><input type="range" id="w2" min="10" max="200" value="100" oninput="updateLayout()"></div>
          <div class="scale-row"><label>Tinggi (%):</label><input type="range" id="h2" min="10" max="200" value="100" oninput="updateLayout()"></div>
          <div class="scale-row"><label>Posisi X:</label><input type="range" id="x2" min="-300" max="300" value="0" oninput="updateLayout()"></div>
        </div>

        <!-- LAYAR TENGAH -->
        <div class="scale-group">
          <span style="color:#10b981; font-weight:bold;">2. Layar Tengah</span>
          <div class="scale-row"><label>Lebar (%):</label><input type="range" id="w1" min="10" max="200" value="100" oninput="updateLayout()"></div>
          <div class="scale-row"><label>Tinggi (%):</label><input type="range" id="h1" min="10" max="200" value="100" oninput="updateLayout()"></div>
          <div class="scale-row"><label>Posisi X:</label><input type="range" id="x1" min="-300" max="300" value="0" oninput="updateLayout()"></div>
        </div>

        <!-- LAYAR KIRI -->
        <div class="scale-group">
          <span style="color:#f59e0b; font-weight:bold;">3. Layar Kiri</span>
          <div class="scale-row"><label>Lebar (%):</label><input type="range" id="w0" min="10" max="200" value="100" oninput="updateLayout()"></div>
          <div class="scale-row"><label>Tinggi (%):</label><input type="range" id="h0" min="10" max="200" value="100" oninput="updateLayout()"></div>
          <div class="scale-row"><label>Posisi X:</label><input type="range" id="x0" min="-300" max="300" value="0" oninput="updateLayout()"></div>
        </div>
      </div>
    </div>

    <!-- BOTTOM MATRIX GRID -->
    <div class="matrix-section">
      <div class="layers-stack">
        <!-- ROW LAYAR KANAN -->
        <div class="layer-row">
          <div class="layer-head">
            <span style="color:#38bdf8; font-weight:700;">LAYAR KANAN</span>
            <span style="color:#64748b; font-size:9px;">Layer Index: 2</span>
          </div>
          <div class="clips-container" id="layer2-clips"></div>
        </div>

        <!-- ROW LAYAR TENGAH -->
        <div class="layer-row">
          <div class="layer-head">
            <span style="color:#10b981; font-weight:700;">LAYAR TENGAH</span>
            <span style="color:#64748b; font-size:9px;">Layer Index: 1</span>
          </div>
          <div class="clips-container" id="layer1-clips"></div>
        </div>

        <!-- ROW LAYAR KIRI -->
        <div class="layer-row">
          <div class="layer-head">
            <span style="color:#f59e0b; font-weight:700;">LAYAR KIRI</span>
            <span style="color:#64748b; font-size:9px;">Layer Index: 0</span>
          </div>
          <div class="clips-container" id="layer0-clips"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- HIDDEN INPUT UNTUK UPLOAD -->
  <input type="file" id="fileUploader" accept="video/*,image/*" style="display:none;" onchange="onFileSelected(event)">

  <script>
    const canvas = document.getElementById('masterCanvas');
    const ctx = canvas.getContext('2d');

    // Data Layar & Slot
    const activeMedia = [null, null, null]; // [Layar Kiri (0), Layar Tengah (1), Layar Kanan (2)]
    const slotData = {}; // Menyimpan data slot per Key
    let targetUploadKey = null;

    // Layout Transform
    const layout = {
      w: [100, 100, 100],
      h: [100, 100, 100],
      x: [0, 0, 0]
    };

    // Inisialisasi Slot (Masing-masing 6 Slot)
    function initSlots() {
      for (let layer = 0; layer < 3; layer++) {
        const container = document.getElementById(`layer${layer}-clips`);
        container.innerHTML = '';
        for (let slot = 0; slot < 6; slot++) {
          const key = `${layer}-${slot}`;
          const slotEl = document.createElement('div');
          slotEl.className = 'clip-slot';
          slotEl.id = `slot-${key}`;
          slotEl.onclick = () => onSlotClick(layer, slot);
          slotEl.innerHTML = `<span style="font-size:22px; color:#475569;">+</span>`;
          container.appendChild(slotEl);
        }
      }
    }

    // Klik pada Slot: Pilih/Upload
    function onSlotClick(layer, slot) {
      const key = `${layer}-${slot}`;
      if (!slotData[key]) {
        targetUploadKey = key;
        const uploader = document.getElementById('fileUploader');
        uploader.value = '';
        uploader.click();
      } else {
        // Saklar Play ke Canvas
        const item = slotData[key];
        if (activeMedia[layer] === item.media) {
          if (item.isVideo) item.media.pause();
          activeMedia[layer] = null;
        } else {
          activeMedia[layer] = item.media;
          if (item.isVideo) item.media.play().catch(() => {});
        }
        updateActiveUI();
      }
    }

    // Proses Pilihan File
    function onFileSelected(e) {
      const file = e.target.files[0];
      if (!file || !targetUploadKey) return;

      const key = targetUploadKey;
      const fileUrl = URL.createObjectURL(file);
      const isVideo = file.type.startsWith('video/');

      if (isVideo) {
        const video = document.createElement('video');
        video.src = fileUrl;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;

        video.onloadedmetadata = () => {
          slotData[key] = { media: video, isVideo: true, url: fileUrl };
          renderSlotUI(key);
        };
      } else {
        const img = new Image();
        img.src = fileUrl;
        img.onload = () => {
          slotData[key] = { media: img, isVideo: false, url: fileUrl };
          renderSlotUI(key);
        };
      }
    }

    // Update Tampilan UI Slot
    function renderSlotUI(key) {
      const slotEl = document.getElementById(`slot-${key}`);
      const item = slotData[key];
      if (!slotEl || !item) return;

      let elementTag = item.isVideo 
        ? `<video src="${item.url}" class="slot-preview" muted loop autoplay></video>`
        : `<img src="${item.url}" class="slot-preview" />`;

      let controls = `
        <div class="slot-overlay-info">${item.isVideo ? 'VIDEO' : 'GAMBAR'}</div>
        <div class="clip-controls" onclick="event.stopPropagation();">
          ${item.isVideo ? `<button class="btn-ctrl" onclick="togglePause('${key}', this)">⏸/▶</button>` : '<span></span>'}
          <button class="btn-ctrl danger" onclick="deleteSlot('${key}')">🗑️ Hapus</button>
        </div>
      `;

      slotEl.innerHTML = elementTag + controls;
      updateActiveUI();
    }

    // Fungsi Pause / Play Video pada Slot
    function togglePause(key, btn) {
      const item = slotData[key];
      if (item && item.isVideo) {
        if (item.media.paused) {
          item.media.play();
        } else {
          item.media.pause();
        }
      }
    }

    // Fungsi Hapus File dari Slot
    function deleteSlot(key) {
      const item = slotData[key];
      if (!item) return;

      const layer = parseInt(key.split('-')[0]);

      if (item.isVideo) {
        item.media.pause();
        item.media.src = '';
      }

      if (activeMedia[layer] === item.media) {
        activeMedia[layer] = null;
      }

      URL.revokeObjectURL(item.url);
      delete slotData[key];

      const slotEl = document.getElementById(`slot-${key}`);
      slotEl.className = 'clip-slot';
      slotEl.innerHTML = `<span style="font-size:22px; color:#475569;">+</span>`;
      
      updateActiveUI();
    }

    // Update Status LIVE pada UI Slot
    function updateActiveUI() {
      for (let layer = 0; layer < 3; layer++) {
        for (let slot = 0; slot < 6; slot++) {
          const key = `${layer}-${slot}`;
          const slotEl = document.getElementById(`slot-${key}`);
          if (!slotEl) continue;

          if (slotData[key] && slotData[key].media === activeMedia[layer]) {
            slotEl.classList.add('active');
          } else {
            slotEl.classList.remove('active');
          }
        }
      }
    }

    // Update Layout dari Slider
    function updateLayout() {
      for (let i = 0; i < 3; i++) {
        layout.w[i] = parseFloat(document.getElementById(`w${i}`).value);
        layout.h[i] = parseFloat(document.getElementById(`h${i}`).value);
        layout.x[i] = parseFloat(document.getElementById(`x${i}`).value);
      }
    }

    // Fullscreen Mode (1 Layar Utuh)
    function toggleFullScreen() {
      const container = document.getElementById('canvasContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // MAIN RENDER LOOP (ENGINE CANVAS 60FPS)
    function draw() {
      ctx.fillStyle = "#050505";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const sectionWidth = canvas.width / 3;

      for (let i = 0; i < 3; i++) {
        const media = activeMedia[i];
        if (media) {
          ctx.save();
          const targetW = sectionWidth * (layout.w[i] / 100);
          const targetH = canvas.height * (layout.h[i] / 100);

          const defaultX = (i * sectionWidth) + (sectionWidth - targetW) / 2;
          const posX = defaultX + layout.x[i];
          const posY = (canvas.height - targetH) / 2;

          try {
            ctx.drawImage(media, posX, posY, targetW, targetH);
          } catch (err) {}
          ctx.restore();
        }
      }

      requestAnimationFrame(draw);
    }

    // Jalan Awal
    initSlots();
    draw();
  </script>
</body>
</html>
