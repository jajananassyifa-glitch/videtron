<script>
  const canvas = document.getElementById('masterCanvas');
  const ctx = canvas.getContext('2d');

  let hiddenPassword = localStorage.getItem('elhajj_password') || '1234';
  let appLogoUrl = localStorage.getItem('elhajj_logo') || 'https://via.placeholder.com/300x150/161920/10b981?text=GRAND+EL+HAJJ';
  let canvasBgColor = '#050505';
  
  let currentScene = 1;
  
  const createDefaultTransform = () => ({
    scaleW: [100, 100, 100],
    scaleH: [100, 100, 100],
    posX: [0, 0, 0]
  });

  const scenePresets = {
    1: { activeMedia: [null, null, null], ...createDefaultTransform() },
    2: { activeMedia: [null, null, null], ...createDefaultTransform() },
    3: { activeMedia: [null, null, null], ...createDefaultTransform() },
    4: { activeMedia: [null, null, null], ...createDefaultTransform() }
  };

  const slotData = {};
  const slotCounts = [6, 6, 6];
  let targetSlotKeyForUpload = null;

  document.getElementById('appLogoImg').src = appLogoUrl;

  function openStudioApp() {
    document.getElementById('splashScreen').style.display = 'none';
  }

  setInterval(() => {
    const now = new Date();
    document.getElementById('studioClock').innerText = now.toLocaleTimeString('id-ID') + ' WIB';
  }, 1000);

  function setCanvasBg(color) {
    canvasBgColor = color;
    document.getElementById('canvasBgPicker').value = color;
  }

  // ENGINE RENDERING CANVAS
  function renderEngine() {
    ctx.fillStyle = canvasBgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const activeMedia = scenePresets[currentScene].activeMedia;
    const { scaleW, scaleH, posX } = scenePresets[currentScene];
    const sectionWidth = canvas.width / 3;

    for (let i = 0; i < 3; i++) {
      const media = activeMedia[i];
      if (media) {
        ctx.save();
        
        const targetW = sectionWidth * (scaleW[i] / 100);
        const targetH = canvas.height * (scaleH[i] / 100);

        const defaultX = (i * sectionWidth) + (sectionWidth - targetW) / 2;
        const xPos = defaultX + posX[i];
        const yPos = (canvas.height - targetH) / 2;

        try {
          ctx.drawImage(media, xPos, yPos, targetW, targetH);
        } catch (e) {
          // Mengabaikan error jika frame video/gambar belum siap
        }
        ctx.restore();
      }
    }

    updateVUMeter();
    requestAnimationFrame(renderEngine);
  }
  renderEngine();

  function initMatrixGrid() {
    for (let layerIdx = 0; layerIdx < 3; layerIdx++) {
      renderLayerSlots(layerIdx);
    }
  }

  function renderLayerSlots(layerIdx) {
    const container = document.getElementById(`layer${layerIdx}-clips`);
    if (!container) return;
    container.innerHTML = '';
    
    for (let slotIdx = 0; slotIdx < slotCounts[layerIdx]; slotIdx++) {
      const slotKey = `${layerIdx}-${slotIdx}`;
      const slot = document.createElement('div');
      slot.className = 'clip-slot';
      slot.id = `slot-${slotKey}`;
      
      if (slotData[slotKey]) {
        const item = slotData[slotKey];
        renderSlotWithControls(slotKey, item.thumbUrl, item.media.tagName === 'VIDEO', item.media);
      } else {
        slot.innerHTML = `<span style="font-size:20px; color:#475569;">+</span>`;
        slot.onclick = () => triggerDirectUpload(slotKey);
      }

      container.appendChild(slot);
    }
  }

  function addNewSlot(layerIdx) {
    slotCounts[layerIdx]++;
    renderLayerSlots(layerIdx);
    updateMatrixActiveUI();
  }

  function triggerDirectUpload(slotKey) {
    targetSlotKeyForUpload = slotKey;
    const input = document.getElementById('directSlotInput');
    input.value = ''; // Reset input agar bisa upload file yang sama jika perlu
    input.click();
  }

  // PENANGANAN FILE UPLOAD (TAMPILKAN GAMBAR/VIDEO SANGAT CEPAT)
  async function handleDirectSlotUpload(event) {
    const file = event.target.files[0];
    if (!file || !targetSlotKeyForUpload) return;

    const currentSlotKey = targetSlotKeyForUpload;
    const [layerIdx] = currentSlotKey.split('-').map(Number);
    const slotEl = document.getElementById(`slot-${currentSlotKey}`);
    
    if (slotEl) slotEl.innerHTML = `<span style="color:#10b981; font-size:10px;">Memuat...</span>`;

    // Hapus media lama jika slot diisi ulang
    if (slotData[currentSlotKey]) {
      deleteSlotMedia(currentSlotKey, false);
    }

    const fileUrl = URL.createObjectURL(file);

    if (file.type.startsWith('video/')) {
      const videoEl = document.createElement('video');
      videoEl.src = fileUrl;
      videoEl.loop = true;
      videoEl.muted = true;
      videoEl.playsInline = true;
      videoEl.crossOrigin = "anonymous";

      videoEl.onloadeddata = async () => {
        let thumbUrl = '';
        try {
          thumbUrl = await generateVideoThumbnail(videoEl);
        } catch (err) {
          thumbUrl = fileUrl; // Fallback jika thumbnail gagal dibuat
        }

        slotData[currentSlotKey] = { media: videoEl, thumbUrl: thumbUrl || fileUrl, objectUrl: fileUrl };
        renderLayerSlots(layerIdx);
        updateMatrixActiveUI();
      };

      videoEl.onerror = () => {
        alert("Format video tidak mendukung atau gagal dimuat.");
        renderLayerSlots(layerIdx);
      };
    } else if (file.type.startsWith('image/')) {
      const imgEl = new Image();
      imgEl.src = fileUrl;
      imgEl.onload = () => {
        slotData[currentSlotKey] = { media: imgEl, thumbUrl: fileUrl, objectUrl: fileUrl };
        renderLayerSlots(layerIdx);
        updateMatrixActiveUI();
      };
      imgEl.onerror = () => {
        alert("Gagal memuat gambar.");
        renderLayerSlots(layerIdx);
      };
    } else {
      alert("Tipe file tidak didukung! Harus berupa gambar atau video.");
      renderLayerSlots(layerIdx);
    }

    targetSlotKeyForUpload = null;
  }

  function renderSlotWithControls(slotKey, imgUrl, isVideo, media) {
    const slotEl = document.getElementById(`slot-${slotKey}`);
    if (!slotEl) return;

    let mediaPreviewHTML = '';
    if (imgUrl) {
      mediaPreviewHTML = `<img src="${imgUrl}" class="clip-thumb" style="width:100%; height:100%; object-fit:cover;" />`;
    } else {
      mediaPreviewHTML = `<div style="background:#1e293b; width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#10b981; font-weight:bold; font-size:10px;">${isVideo ? 'VIDEO' : 'GAMBAR'}</div>`;
    }

    let controlsHTML = '';
    if (isVideo) {
      controlsHTML = `
        <div class="clip-controls" onclick="event.stopPropagation();">
          <button class="btn-ctrl" onclick="togglePlayPause('${slotKey}', this)">${media.paused ? '▶ Play' : '⏸ Pause'}</button>
          <button class="btn-ctrl ${media.loop ? 'active' : ''}" onclick="toggleLoop('${slotKey}', this)">🔁 Loop</button>
          <button class="btn-ctrl danger" onclick="deleteSlotMedia('${slotKey}')">🗑️</button>
        </div>
      `;
    } else {
      controlsHTML = `
        <div class="clip-controls" onclick="event.stopPropagation();">
          <span style="font-size:8px; color:#aaa;">Gambar</span>
          <button class="btn-ctrl danger" onclick="deleteSlotMedia('${slotKey}')">🗑️</button>
        </div>
      `;
    }

    slotEl.innerHTML = mediaPreviewHTML + controlsHTML;

    slotEl.onclick = () => {
      const layerIdx = parseInt(slotKey.split('-')[0]);
      const slotIdx = parseInt(slotKey.split('-')[1]);
      triggerSlot(layerIdx, slotIdx);
    };
  }

  function togglePlayPause(slotKey, btn) {
    const item = slotData[slotKey];
    if (item && item.media.tagName === 'VIDEO') {
      if (item.media.paused) {
        item.media.play();
        btn.innerText = "⏸ Pause";
      } else {
        item.media.pause();
        btn.innerText = "▶ Play";
      }
    }
  }

  function toggleLoop(slotKey, btn) {
    const item = slotData[slotKey];
    if (item && item.media.tagName === 'VIDEO') {
      item.media.loop = !item.media.loop;
      btn.classList.toggle('active', item.media.loop);
    }
  }

  // PENANGANAN HAPUS SLOT MEDIA SECARA BERSIH
  function deleteSlotMedia(slotKey, reRender = true) {
    const item = slotData[slotKey];
    if (!item) return;

    const layerIdx = parseInt(slotKey.split('-')[0]);

    // 1. Hentikan pemutaran video jika video sedang aktif
    if (item.media.tagName === 'VIDEO') {
      item.media.pause();
      item.media.currentTime = 0;
      item.media.src = '';
      item.media.load();
    }

    // 2. Lepas dari layar scene yang sedang aktif
    Object.keys(scenePresets).forEach(sKey => {
      if (scenePresets[sKey].activeMedia[layerIdx] === item.media) {
        scenePresets[sKey].activeMedia[layerIdx] = null;
      }
    });

    // 3. Bebaskan memori browser (Revoke ObjectURL)
    if (item.objectUrl) {
      URL.revokeObjectURL(item.objectUrl);
    }

    // 4. Hapus data slot
    delete slotData[slotKey];

    // 5. Render ulang tampilan slot
    if (reRender) {
      renderLayerSlots(layerIdx);
      updateMatrixActiveUI();
    }
  }

  function generateVideoThumbnail(videoEl) {
    return new Promise((resolve) => {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 160; 
      tempCanvas.height = 90;
      const tempCtx = tempCanvas.getContext('2d');
      
      const capture = () => {
        try {
          tempCtx.drawImage(videoEl, 0, 0, tempCanvas.width, tempCanvas.height);
          resolve(tempCanvas.toDataURL('image/jpeg'));
        } catch (e) {
          resolve('');
        }
      };

      if (videoEl.readyState >= 2) {
        capture();
      } else {
        videoEl.onloadeddata = capture;
        setTimeout(() => resolve(''), 1000);
      }
    });
  }

  function toggleFullScreen() {
    const container = document.getElementById('canvasContainer');
    if (!document.fullscreenElement) {
      container.requestFullscreen().catch(err => {
        alert(`Gagal masuk Fullscreen: ${err.message}`);
      });
    } else {
      document.exitFullscreen();
    }
  }

  function promptProtectedSettings() {
    const inputPass = prompt("Masukkan Password Tersembunyi Dashboard:");
    if (inputPass === hiddenPassword) {
      document.getElementById('settingsModal').style.display = 'flex';
    } else if (inputPass !== null) {
      alert("Password Salah! Akses Ditolak.");
    }
  }

  function closeSettingsModal() {
    document.getElementById('settingsModal').style.display = 'none';
  }

  function updateLogoFromFile(event) {
    const file = event.target.files[0];
    if (file) {
      const logoUrl = URL.createObjectURL(file);
      appLogoUrl = logoUrl;
      document.getElementById('appLogoImg').src = logoUrl;
      localStorage.setItem('elhajj_logo', logoUrl);
    }
  }

  function saveHiddenSettings() {
    const newPass = document.getElementById('newPasswordInput').value.trim();
    if (newPass !== '') {
      hiddenPassword = newPass;
      localStorage.setItem('elhajj_password', newPass);
      alert("Password Baru Berhasil Disimpan!");
    }
    closeSettingsModal();
  }

  function switchScene(sceneNumber) {
    currentScene = sceneNumber;
    for (let i = 1; i <= 4; i++) {
      document.getElementById(`btnScene${i}`)?.classList.toggle('active', i === sceneNumber);
    }
    document.getElementById('currentSceneTitle').innerText = `PROGRAM OUTPUT - SCENE ${sceneNumber}`;

    const { scaleW, scaleH, posX } = scenePresets[currentScene];
    
    document.getElementById('scaleLeftW').value = scaleW[0];
    document.getElementById('scaleLeftH').value = scaleH[0];
    document.getElementById('posXLeft').value = posX[0];

    document.getElementById('scaleCenterW').value = scaleW[1];
    document.getElementById('scaleCenterH').value = scaleH[1];
    document.getElementById('posXCenter').value = posX[1];

    document.getElementById('scaleRightW').value = scaleW[2];
    document.getElementById('scaleRightH').value = scaleH[2];
    document.getElementById('posXRight').value = posX[2];

    updateMatrixActiveUI();
  }

  function updateScales() {
    const sp = scenePresets[currentScene];

    sp.scaleW[0] = parseFloat(document.getElementById('scaleLeftW').value);
    sp.scaleH[0] = parseFloat(document.getElementById('scaleLeftH').value);
    sp.posX[0] = parseFloat(document.getElementById('posXLeft').value);

    sp.scaleW[1] = parseFloat(document.getElementById('scaleCenterW').value);
    sp.scaleH[1] = parseFloat(document.getElementById('scaleCenterH').value);
    sp.posX[1] = parseFloat(document.getElementById('posXCenter').value);

    sp.scaleW[2] = parseFloat(document.getElementById('scaleRightW').value);
    sp.scaleH[2] = parseFloat(document.getElementById('scaleRightH').value);
    sp.posX[2] = parseFloat(document.getElementById('posXRight').value);
  }

  function triggerSlot(layerIdx, slotIdx) {
    const slotKey = `${layerIdx}-${slotIdx}`;
    const item = slotData[slotKey];
    const currentActive = scenePresets[currentScene].activeMedia;

    if (!item) return;

    if (currentActive[layerIdx] === item.media) {
      if (item.media.tagName === 'VIDEO') item.media.pause();
      currentActive[layerIdx] = null;
    } else {
      currentActive[layerIdx] = item.media;
      if (item.media.tagName === 'VIDEO') {
        item.media.play().catch(e => console.log("Autoplay dicegah browser:", e));
      }
    }

    updateMatrixActiveUI();
  }

  function updateMatrixActiveUI() {
    const currentActive = scenePresets[currentScene].activeMedia;
    for (let l = 0; l < 3; l++) {
      const container = document.getElementById(`layer${l}-clips`);
      if (!container) continue;
      
      Array.from(container.children).forEach(c => c.classList.remove('active'));
      
      Object.keys(slotData).forEach(slotKey => {
        if (slotData[slotKey].media === currentActive[l]) {
          document.getElementById(`slot-${slotKey}`)?.classList.add('active');
        }
      });
    }
  }

  function toggleRunningText() {
    const txt = document.getElementById('txtMarquee').value;
    const box = document.getElementById('tickerBox');
    const content = document.getElementById('tickerContent');

    if (box.style.display === 'block') {
      box.style.display = 'none';
    } else if (txt.trim() !== '') {
      content.innerText = txt;
      box.style.display = 'block';
    }
  }

  function setMasterVolume(val) {
    Object.values(slotData).forEach(item => {
      if (item.media.tagName === 'VIDEO') item.media.volume = val;
    });
  }

  function updateVUMeter() {
    const hasActiveVideo = scenePresets[currentScene].activeMedia.some(m => m && m.tagName === 'VIDEO' && !m.paused);
    const vuFill = document.getElementById('vuFill');
    if (vuFill) {
      if (hasActiveVideo) {
        vuFill.style.width = Math.floor(Math.random() * 60 + 30) + '%';
      } else {
        vuFill.style.width = '0%';
      }
    }
  }

  function saveShowPreset() {
    localStorage.setItem('grand_elhajj_preset_pro', JSON.stringify(scenePresets));
    alert("Susunan Acara Berhasil Disimpan!");
  }

  function loadShowPreset() {
    const data = localStorage.getItem('grand_elhajj_preset_pro');
    if (data) {
      alert("Preset Scene Berhasil Dimuat!");
    } else {
      alert("Belum ada preset tersimpan.");
    }
  }

  // Inisialisasi awal
  initMatrixGrid();
</script>
