<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand El Hajj Studio - Offline Standalone Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh; background-color: #0f1115; color: #d1d5db;
      display: flex; flex-direction: column; overflow: hidden; font-size: 11px;
    }

    header {
      height: 42px; background: #161920; border-bottom: 1px solid #262b36;
      display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
    }
    .brand { font-weight: 800; font-size: 13px; color: #10b981; letter-spacing: 1.5px; }

    .workspace { display: flex; flex-direction: column; flex: 1; height: calc(100vh - 42px); }

    /* DISPLAY OUTPUT AREA */
    .top-section { display: flex; height: 55%; background: #0b0c10; border-bottom: 1px solid #262b36; }
    .display-box { flex: 1; background: #000; display: flex; flex-direction: column; position: relative; }
    .display-header { background: #161920; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #262b36; }
    
    .screen-container {
      flex: 1; display: flex; width: 100%; height: 100%; background: #050505; position: relative; overflow: hidden;
    }
    .screen-partition {
      flex: 1; height: 100%; border-right: 1px solid #1e293b; position: relative;
      display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden;
    }
    .screen-partition:last-child { border-right: none; }
    
    .screen-partition video, .screen-partition img {
      width: 100%; height: 100%; object-fit: contain; pointer-events: none;
    }

    /* MATRIX GRID */
    .matrix-section { display: flex; flex: 1; background: #0f1115; overflow: hidden; }
    .layers-stack { flex: 1; display: flex; flex-direction: column; padding: 8px; gap: 8px; overflow-y: auto; }

    .layer-row { display: flex; height: 100px; background: #161920; border: 1px solid #262b36; border-radius: 4px; }
    .layer-head { width: 140px; background: #1a1e26; padding: 8px; border-right: 1px solid #262b36; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    
    .clips-container { flex: 1; display: flex; gap: 8px; padding: 8px; overflow-x: auto; align-items: center; }
    
    .clip-slot {
      min-width: 110px; width: 110px; height: 100%; background: #1a1e26; border: 1px dashed #334155; border-radius: 4px;
      cursor: pointer; position: relative; overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
    }
    .clip-slot:hover { border-color: #10b981; background: #222733; }
    .clip-slot.active { border: 2px solid #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
    .clip-slot.active::after {
      content: 'LIVE'; position: absolute; top: 2px; right: 2px; background: #ef4444; color: #fff;
      font-size: 8px; font-weight: bold; padding: 1px 4px; border-radius: 2px; z-index: 6;
    }

    .slot-thumb-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center; }
    .slot-thumb-container video, .slot-thumb-container img { width: 100%; height: 100%; object-fit: cover; }

    .btn-delete {
      position: absolute; bottom: 2px; right: 2px; background: #ef4444; color: #fff; border: none;
      padding: 2px 6px; font-size: 9px; border-radius: 2px; cursor: pointer; z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">GRAND EL HAJJ // STUDIO ENGINE</div>
    <div style="font-family: monospace; font-size: 12px; color: #38bdf8;" id="studioClock">00:00:00 WIB</div>
  </header>

  <div class="workspace">

    <!-- DISPLAY SCREEN UTAMA -->
    <div class="top-section">
      <div class="display-box">
        <div class="display-header">
          <span style="font-weight:700; color:#38bdf8;">PROGRAM OUTPUT</span>
          <button style="background:#1e293b; color:#fff; border:1px solid #334155; padding:3px 8px; border-radius:3px; cursor:pointer;" onclick="toggleFullScreen()">🖥️ FULLSCREEN</button>
        </div>
        
        <div class="screen-container" id="screenContainer">
          <!-- LAYAR KIRI (0) -->
          <div class="screen-partition" id="screen-0">
            <span style="color:#475569;">LAYAR KIRI</span>
          </div>
          <!-- LAYAR TENGAH (1) -->
          <div class="screen-partition" id="screen-1">
            <span style="color:#475569;">LAYAR TENGAH</span>
          </div>
          <!-- LAYAR KANAN (2) -->
          <div class="screen-partition" id="screen-2">
            <span style="color:#475569;">LAYAR KANAN</span>
          </div>
        </div>
      </div>
    </div>

    <!-- MATRIX CONTROL -->
    <div class="matrix-section">
      <div class="layers-stack">
        
        <!-- ROW LAYAR KANAN -->
        <div class="layer-row">
          <div class="layer-head">
            <span style="color:#38bdf8; font-weight:700;">LAYAR KANAN</span>
            <button style="background:#10b981; border:none; padding:2px; font-weight:bold; cursor:pointer;" onclick="addNewSlot(2)">+ Slot</button>
          </div>
          <div class="clips-container" id="layer2-clips"></div>
        </div>

        <!-- ROW LAYAR TENGAH -->
        <div class="layer-row">
          <div class="layer-head">
            <span style="color:#10b981; font-weight:700;">LAYAR TENGAH</span>
            <button style="background:#10b981; border:none; padding:2px; font-weight:bold; cursor:pointer;" onclick="addNewSlot(1)">+ Slot</button>
          </div>
          <div class="clips-container" id="layer1-clips"></div>
        </div>

        <!-- ROW LAYAR KIRI -->
        <div class="layer-row">
          <div class="layer-head">
            <span style="color:#f59e0b; font-weight:700;">LAYAR KIRI</span>
            <button style="background:#10b981; border:none; padding:2px; font-weight:bold; cursor:pointer;" onclick="addNewSlot(0)">+ Slot</button>
          </div>
          <div class="clips-container" id="layer0-clips"></div>
        </div>

      </div>
    </div>

  </div>

  <input type="file" id="globalFileInput" accept="video/*,image/*" style="display:none;" onchange="handleFileUpload(event)">

  <script>
    const slotCounts = [6, 6, 6];
    const slotsData = {}; 
    const activeMediaKeys = [null, null, null]; 
    let targetUploadKey = null;

    setInterval(() => {
      document.getElementById('studioClock').innerText = new Date().toLocaleTimeString('id-ID') + ' WIB';
    }, 1000);

    function initMatrix() {
      for (let l = 0; l < 3; l++) {
        renderLayer(l);
      }
    }

    function renderLayer(layerIdx) {
      const container = document.getElementById(`layer${layerIdx}-clips`);
      if (!container) return;
      container.innerHTML = '';

      for (let s = 0; s < slotCounts[layerIdx]; s++) {
        const key = `${layerIdx}-${s}`;
        const slot = document.createElement('div');
        slot.className = 'clip-slot';
        if (activeMediaKeys[layerIdx] === key) slot.classList.add('active');

        if (slotsData[key]) {
          const item = slotsData[key];
          
          const thumbContainer = document.createElement('div');
          thumbContainer.className = 'slot-thumb-container';
          
          if (item.type === 'video') {
            const v = document.createElement('video');
            v.src = item.url;
            v.muted = true;
            v.currentTime = 0.5;
            thumbContainer.appendChild(v);
          } else {
            const img = document.createElement('img');
            img.src = item.url;
            thumbContainer.appendChild(img);
          }

          const btnDel = document.createElement('button');
          btnDel.className = 'btn-delete';
          btnDel.innerText = '🗑️';
          btnDel.onclick = (e) => {
            e.stopPropagation();
            removeSlotMedia(key, layerIdx);
          };

          slot.appendChild(thumbContainer);
          slot.appendChild(btnDel);
          slot.onclick = () => playToScreen(layerIdx, key);
        } else {
          slot.innerHTML = `<span style="font-size:24px; color:#475569;">+</span>`;
          slot.onclick = () => openFileSelector(key);
        }

        container.appendChild(slot);
      }
    }

    function addNewSlot(layerIdx) {
      slotCounts[layerIdx]++;
      renderLayer(layerIdx);
    }

    function openFileSelector(key) {
      targetUploadKey = key;
      const input = document.getElementById('globalFileInput');
      input.value = '';
      input.click();
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file || !targetUploadKey) return;

      const fileUrl = URL.createObjectURL(file);
      const isVideo = file.type.startsWith('video/');
      const [layerIdx] = targetUploadKey.split('-').map(Number);

      slotsData[targetUploadKey] = {
        url: fileUrl,
        type: isVideo ? 'video' : 'image'
      };

      renderLayer(layerIdx);
      targetUploadKey = null;
    }

    function playToScreen(layerIdx, key) {
      const screen = document.getElementById(`screen-${layerIdx}`);
      const item = slotsData[key];

      if (!item) return;

      if (activeMediaKeys[layerIdx] === key) {
        activeMediaKeys[layerIdx] = null;
        screen.innerHTML = `<span style="color:#475569;">LAYAR ${layerIdx === 0 ? 'KIRI' : layerIdx === 1 ? 'TENGAH' : 'KANAN'}</span>`;
        renderLayer(layerIdx);
        return;
      }

      activeMediaKeys[layerIdx] = key;
      screen.innerHTML = '';

      if (item.type === 'video') {
        const video = document.createElement('video');
        video.src = item.url;
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        screen.appendChild(video);
        video.play().catch(err => console.log('Autoplay:', err));
      } else {
        const img = document.createElement('img');
        img.src = item.url;
        screen.appendChild(img);
      }

      renderLayer(layerIdx);
    }

    function removeSlotMedia(key, layerIdx) {
      if (activeMediaKeys[layerIdx] === key) {
        activeMediaKeys[layerIdx] = null;
        const screen = document.getElementById(`screen-${layerIdx}`);
        screen.innerHTML = `<span style="color:#475569;">LAYAR ${layerIdx === 0 ? 'KIRI' : layerIdx === 1 ? 'TENGAH' : 'KANAN'}</span>`;
      }
      delete slotsData[key];
      renderLayer(layerIdx);
    }

    function toggleFullScreen() {
      const elem = document.getElementById('screenContainer');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    initMatrix();
  </script>
</body>
</html>
